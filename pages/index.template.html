function plot(){
  if(history){renderMetricChart();return;}
  const isRevenue = metric === 0;
  const names = [tr('Revenue','売上高'),tr('Diluted EPS','希薄化後EPS')];
  const values = records.map(d=>isRevenue ? rev(d) : (d.facts[1].value == null ? null : Number(d.facts[1].value)));
  const suffix = isRevenue ? tr('USD billions','十億ドル') : tr('USD/share','ドル／株');
  // Three equal intervals above a zero baseline; keep the two units independent.
  const max = Math.max(1, ...values.filter(v=>v !== null));
  const magnitude = 10 ** Math.floor(Math.log10(max / 3));
  const step = Math.ceil(max / (3 * magnitude)) * magnitude;
  for(const id of ['bars','periods']) $(id).style.gridTemplateColumns = 'repeat('+records.length+', minmax(0,1fr))';
  const ceiling = 3 * step;
  const format = v=>v == null ? '—' : isRevenue ? v.toLocaleString('en-US',{maximumFractionDigits:3}) : v.toFixed(2);
  $('chartTitle').textContent=records.length === 1 ? tr('Reported quarter','対象四半期の値') : tr('Quarterly performance','四半期推移');
  $('axisUnit').textContent=suffix;
  $('plotTools').setAttribute('aria-label',tr('Chart metric','グラフの指標'));
  $('plotTools').innerHTML=names.map((n,i)=>'<button type="button" data-m="'+i+'" aria-pressed="'+(metric===i)+'">'+n+'</button>').join('');
  $('scale').innerHTML=[0,1,2,3].map(n=>'<span style="bottom:'+(100*n/3)+'%">'+Number((n*step).toPrecision(6))+'</span>').join('');
  $('bars').setAttribute('aria-label',names[metric]+' · '+suffix);
  $('bars').innerHTML=records.map((d,i)=>{
    const label=periodText(d.period)+' · '+names[metric]+' · '+format(values[i])+' '+suffix;
    return '<button type="button" class="plot-col" data-i="'+i+'" aria-pressed="'+(i===selected)+'" aria-label="'+label+'" title="'+label+'"><i aria-hidden="true" style="height:'+(100*(values[i] ?? 0)/ceiling)+'%"></i></button>';
  }).join('');
  $('periods').innerHTML=records.map(d=>'<span>'+d.period.slice(-2)+'<small>FY'+d.period.slice(4,6)+'</small></span>').join('');
  $('plotValue').textContent=periodText(records[selected].period)+' · '+format(values[selected])+' '+suffix;
}

  const rows=landingRows();
  $('feedRows').replaceChildren(...rows.map(feedRow));
  const metricCount=rows.reduce((n,r)=>n+r.d.facts.filter(f=>!homeState.status||f.status===homeState.status).length,0);
  $('resultCount').textContent=tr(rows.length+' quarter'+(rows.length===1?'':'s')+' · '+metricCount+' check'+(metricCount===1?'':'s'),'対象 '+rows.length+'四半期 · 照合 '+metricCount+'件');
  $('emptyResult').hidden=!!rows.length;$('emptyResult').textContent=tr('No quarters match these filters.','この条件に該当する四半期はありません。');
  $('homeDownload').disabled=!rows.length;
  $('publicScope').textContent=tr('¹ Each chart shows up to eight quarters of revenue ending with the quarter shown. Each row has its own scale. An independent project using SEC EDGAR filings.','¹ 売上高のグラフは、その行の四半期までの最大8期を示します。目盛りは行ごとに異なります。SECの開示書類を使用した独立プロジェクトです。');
}

  const header=['Ticker','Company','Data as of','Fiscal quarter','Period end','Release filed','Report filed','Metric','Unit','Reported value','Comparison value','Automated check','Human review','8-K accession','Form 8-K','Exhibit 99.1','Periodic report form','Periodic report','Report accession','Exhibit SHA-256','Report SHA-256','Comparison source','Exception','Other filing candidates'];

  appendMetricCSV(header,rows,new Map(landingRows().map(({symbol,d})=>[symbol+'/'+d.period,d])),homeState.status);
  const csv=[header,...rows].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')+'\r\n';
  const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));
  const a=node('a');a.href=url;a.download='disclosure-'+(homeState.symbol||'m7')+'-'+homeState.mode+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$('narrSelect').onchange=e=>{
  chosenAcc=e.target.value;
  if(location.protocol!=='file:')window.history.replaceState(null,'',narrativeURL(ticker,chosenAcc));

};

  if(!onHome && location.protocol!=='file:'){
    const url=eventPage?narrativeURL(ticker,chosenAcc):detailURL(ticker,records[selected].period);
    window.history.replaceState(null,'',url+(query.has('baseline')?'&baseline=1':''));

};
$('download').onclick=()=>{
const fields=['Fiscal quarter','Metric','Reported value','Unit','Comparison value','Comparison unit','Comparison row','Comparison column','Check','Human review','Accession','Form 8-K','Exhibit 99.1','SHA-256'];
if(history || has10Q) fields.push('Periodic report','Report accession','Report SHA-256','Exception','Report form','Period end');

};
