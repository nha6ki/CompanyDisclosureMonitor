function renderSection(sec,acc){

    box.append(node('p',tr('Unreviewed output is available in the local review copy.','確認前の候補は手元の確認版で閲覧できます。')));return box;
  }
  const prefix='source-'+acc+'-'+sec.id;
  for(const e of sec.events){
    const article=node('article',null,'narr-event'),dl=node('dl');
    article.append(node('h4',e.subject.value+' · '+term(e.event_type.value)));
    for(const [label,field] of [[tr('Extracted summary (Japanese)','抽出内容'),e.summary_ja],

      [tr('At filing date','提出時点の状態'),{...e.status_as_of_filing,value:term(e.status_as_of_filing.value)}],
      ...e.dates.map(d=>[term(d.role)+' · '+term(d.certainty),d]),
      ...e.conditions.map(c=>[tr('Condition','条件'),c]),[tr('Note (Japanese)','補足'),e.notes_ja]]){
      narrativeField(dl,label,field,prefix);

  for(const note of sec.missing||[])box.append(node('p',note));
  if(sec.blocks.length){

    sources.append(node('summary',tr('Source paragraphs','SEC原文の根拠段落')+' ('+sec.blocks.length+')'));

  const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));
  const a=node('a');a.href=url;a.download='disclosure-'+(homeState.symbol||'m7')+'-'+homeState.mode+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};

  if(location.protocol!=='file:')window.history.replaceState(null,'',narrativeURL(ticker,chosenAcc));

if(history || has10Q) fields.push('Periodic report','Report accession','Report SHA-256','Exception','Report form','Period end');
const rows=records.flatMap(d=>d.facts.map(f=>[d.period,f.metric,f.value,f.unit,f.detail,f.detailUnit,f.row,f.column,labels[f.status][0],d.state || 'Pending',d.accession,d.filing,d.url,d.sha,...(history || has10Q ? [d.quarterly,d.quarterlyAccession,d.quarterlySha,f.reason,d.form || (history ? '' : '10-Q'),d.end || ''] : [])]));
const csv=[fields,...rows].map(r=>r.map(x=>'"'+String(x ?? '').replaceAll('"','""')+'"').join(',')).join('\r\n')+'\r\n';
const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=history ? ticker+'-'+records[0].period+'-'+records.at(-1).period+'.csv' : has10Q ? companyName.toLowerCase().replaceAll(' ','-')+'-'+records[0].period+'-reconciliation.csv' : 'nvidia-filing-coverage-FY2025Q4-FY2027Q3.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
