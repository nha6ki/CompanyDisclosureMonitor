r share / Diluted", "column": "Three Months Ended January 25, 2026", "status": "一致", "metric": "Diluted earnings per share", "summaryRow": "Diluted earnings per share"}]}, {"period": "FY2027Q1", "accession": "0001045810-26-000051", "url": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000051/q1fy27pr.htm", "filing": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000051/nvda-20260520.htm", "sha": "2987ebc03457f44d67d847c14a68a2fca1dd130d6c841245057a4f8b6c29843d", "facts": [{"value": "81615", "unit": "USD millions", "detail": "81,615", "detailUnit": "USD millions", "row": "Revenue", "column": "Three Months Ended April 26, 2026", "status": "一致", "metric": "Revenue", "summaryRow": "Revenue"}, {"value": "2.39", "unit": "USD/share", "detail": "2.39", "detailUnit": "USD/share", "row": "Net income per share / Diluted", "column": "Three Months Ended April 26, 2026", "status": "一致", "metric": "Diluted earnings per share", "summaryRow": "Diluted earnings per share"}]}, {"period": "FY2027Q2", "accession": "0001045810-26-000073", "url": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/q2fy27pr.htm", "filing": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000073/nvda-20260826.htm", "sha": "972e6c1d066a7ed8f114fcd866c89177c6bfb3f54a80c318b71a8d936fb0d164", "facts": [{"value": "96221", "unit": "USD millions", "detail": "96,221", "detailUnit": "USD millions", "row": "Revenue", "column": "Three Months Ended July 26, 2026", "status": "一致", "metric": "Revenue", "summaryRow": "Revenue"}, {"value": "2.46", "unit": "USD/share", "detail": "2.46", "detailUnit": "USD/share", "row": "Net income per share / Diluted", "column": "Three Months Ended July 26, 2026", "status": "一致", "metric": "Diluted earnings per share", "summaryRow": "Diluted earnings per share"}]}, {"period": "FY2027Q3", "accession": "0001045810-26-000088", "url": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/q3fy27pr.htm", "filing": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000088/nvda-20261117.htm", "sha": "699e2bf368f8a57fd056d7edb7d9d97f8abf4e57ec086fe988fd4933a169ef35", "facts": [{"value": "115.8", "unit": "USD billions", "detail": "115,844", "detailUnit": "USD millions", "row": "Revenue", "column": "Three Months Ended October 25, 2026", "status": "丸めの範囲で一致", "metric": "Revenue", "summaryRow": "Revenue"}, {"value": "2.70", "unit": "USD/share", "detail": "2.70", "detailUnit": "USD/share", "row": "Net income per share / Diluted", "column": "Three Months Ended October 25, 2026", "status": "一致", "metric": "Diluted earnings per share", "summaryRow": "Diluted earnings per share"}]}];
const $=id=>document.getElementById(id);
let ja=false,selected=records.length-1,metric=0;
const tr=(en,jp)=>ja?jp:en;

const numbers=(x,places)=>Number(x.replaceAll(',','')).toLocaleString('en-US',{minimumFractionDigits:places,maximumFractionDigits:places});
function unit(u){return {'USD billions':tr('USD billion','十億ドル'),'USD millions':tr('USD million','百万ドル'),'USD/share':tr('USD/share','ドル／株')}[u]}
function check(s){return s==='一致'?tr('Exact','一致'):tr('Rounded','丸め一致')}
function pill(s){return '<span class="pill '+(s==='一致'?'':'round')+'">'+check(s)+'</span>'}
function rev(d){const f=d.facts[0];return Number(f.value)/(f.unit==='USD millions'?1000:1)}
function focusPanel(){if(matchMedia('(max-width:730px)').matches){$('focus').focus({preventScroll:true});$('focus').scrollIntoView({block:'start'})}}
function evidence(){
const d=records[selected], f=d.facts[metric];$('selected').textContent=periodText(d.period);$('accession').textContent=d.accession;
$('tabs').innerHTML=[tr('Revenue','売上高'),tr('Diluted EPS','希薄化後EPS')].map((t,i)=>'<button aria-pressed="'+(metric===i)+'" data-m="'+i+'">'+t+'</button>').join('');

 tr('115,844 million ÷ 1,000 = 115.844 billion. Rounded to one decimal, the result is 115.8 billion.','115,844百万ドルは115.844十億ドルです。小数第1位に丸めると、概要表の115.8十億ドルと一致します。');

}
function plot(){
  const isRevenue = metric === 0;
  const names = [tr('Revenue','売上高'),tr('Diluted EPS','希薄化後EPS')];
  const values = records.map(d=>isRevenue ? rev(d) : Number(d.facts[1].value));
  const suffix = isRevenue ? tr('USD billions','十億ドル') : tr('USD/share','ドル／株');
  // Three equal intervals above a zero baseline; keep the two units independent.
  const step = isRevenue ? 40 : 1;
  const ceiling = 3 * step;
  const format = v=>isRevenue ? v.toLocaleString('en-US',{maximumFractionDigits:3}) : v.toFixed(2);
  $('chartTitle').textContent=tr('Quarterly performance','四半期推移');
  $('axisUnit').textContent=suffix;
  $('plotTools').setAttribute('aria-label',tr('Chart metric','グラフの指標'));
  $('plotTools').innerHTML=names.map((n,i)=>'<button type="button" data-m="'+i+'" aria-pressed="'+(metric===i)+'">'+n+'</button>').join('');
  $('scale').innerHTML=[0,1,2,3].map(n=>'<span style="bottom:'+(100*n/3)+'%">'+(n*step)+'</span>').join('');
  $('bars').setAttribute('aria-label',names[metric]+' · '+suffix);
  $('bars').innerHTML=records.map((d,i)=>{
    const label=periodText(d.period)+' · '+names[metric]+' · '+format(values[i])+' '+suffix;
    return '<button type="button" class="plot-col" data-i="'+i+'" aria-pressed="'+(i===selected)+'" aria-label="'+label+'" title="'+label+'"><i aria-hidden="true" style="height:'+(100*values[i]/ceiling)+'%"></i></button>';
  }).join('');

}

function draw(){
document.documentElement.lang=ja?'ja':'en';
$('lang').textContent=ja?'English':'日本語';$('lang').lang=ja?'en':'ja';
$('title').textContent=tr('NVIDIA filing coverage','NVIDIA 決算開示台帳');
$('summary').textContent=tr('Trace eight quarters of revenue and diluted EPS from SEC filings to a downloadable dataset.','8四半期の売上高と希薄化後EPSを、納品データからSECの原表までたどれます。');
$('period').textContent='FY2025 Q4 — FY2027 Q3  ·  '+tr('Fixed dataset','固定データ');
plot();
$('stats').innerHTML=[['8 / 8',tr('Quarters covered','対象四半期')],['16 / 16',tr('Metrics retrieved','取得した指標')],['15',tr('Exact matches','完全一致')],['1',tr('Match after rounding','丸めの範囲で一致')]].map(([n,t])=>'<div class="stat"><strong>'+n+'</strong><span>'+t+'</span></div>').join('');
$('ledgerTitle').textContent=tr('Quarterly register','四半期台帳');$('ledgerSub').textContent=tr('Select a quarter to inspect its source figures.','四半期を選ぶと、原表の値と判定理由を確認できます。');
$('download').textContent=tr('↓  Download CSV','↓  CSVを取得');$('head').innerHTML='<tr>'+[tr('Fiscal quarter','会計四半期'),tr('Revenue ($B)','売上高 ($B)'),tr('EPS ($)','EPS ($)'),tr('Revenue check','売上照合')].map(t=>'<th scope="col">'+t+'</th>').join('')+'</tr>';
$('evidence').textContent=tr('Source comparison','原表との照合');$('skip').textContent=tr('Skip to register','台帳へ移動');
$('methodTitle').textContent=tr('Scope and verification method','対象範囲と検査方法');
$('method').textContent=tr('This independent demo covers NVIDIA GAAP revenue and diluted EPS for the eight fiscal quarters shown. Python compares the current-quarter GAAP summary with the three-month column of the consolidated income statement in the same SEC exhibit. The register shows revenue in billions of US dollars. The evidence panel and CSV retain the source units. All 16 human reviews are pending.','NVIDIAの8四半期を対象とした独立デモです。Pythonが同じ提出書類内のGAAP概要表と連結損益計算書の当四半期（3か月）列を照合しています。台帳は売上高を十億ドルで表示し、原表比較とCSVは開示時の単位を保持します。16項目すべて担当者確認は未確認です。');
ledger();evidence();
}
for(const id of ['bars','rows']){
  $(id).onclick=e=>{
    const button=e.target.closest('button[data-i]');
    if(!button)return;
    selectChart(()=>{selected=Number(button.dataset.i)},id);
    if(id==='rows') focusPanel();
  };
}
for(const id of ['plotTools','tabs']){
  $(id).onclick=e=>{
    const button=e.target.closest('button[data-m]');
    if(button) selectChart(()=>{metric=Number(button.dataset.m)},id);
  };
}
$('lang').onclick=()=>{ja=!ja;draw()};
$('download').onclick=()=>{
const fields=['Fiscal quarter','Metric','Reported value','Unit','Comparison value','Comparison unit','Comparison row','Comparison column','Check','Human review','Accession','Form 8-K','Exhibit 99.1','SHA-256'];
const rows=records.flatMap(d=>d.facts.map(f=>[d.period,f.metric,f.value,f.unit,f.detail,f.detailUnit,f.row,f.column,f.status==='一致'?'Exact':'Match after rounding','Pending',d.accession,d.filing,d.url,d.sha]));
const csv=[fields,...rows].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')+'\r\n';
const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='nvidia-filing-coverage-FY2025Q4-FY2027Q3.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
draw();
</script></body></html>
