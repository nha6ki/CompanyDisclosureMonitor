function focusPanel(){if(matchMedia('(max-width:730px)').matches){$('focus').focus({preventScroll:true});$('focus').scrollIntoView({block:'start'})}}
function evidence(){
const d=records[selected], f=d.facts[metric];$('selected').textContent=periodText(d.period);$('accession').textContent=d.accession;
$('tabs').innerHTML=[tr('Revenue','売上高'),tr('Diluted EPS','希薄化後EPS')].map((t,i)=>'<button aria-pressed="'+(metric===i)+'" data-m="'+i+'">'+t+'</button>').join('');
const reading = $('reading');
reading.replaceChildren();
function line(tag, text, className, parent=reading){
  const el = document.createElement(tag);
  el.textContent = text;
  if(className) el.className = className;
  parent.append(el);
  return el;
}
function fact(title, value, units){
  const box = line('div','','fact');
  line('span',title,'',box);
  const decimals = value == null ? 0 : (value.split('.')[1] || '').length;
  line('strong',numbers(value,decimals),'',box);
  line('small',' '+unit(units),'',box);
}
fact((has10Q ? tr('EX-99.1 income statement','決算添付99.1の損益計算書') : tr('GAAP summary','GAAP概要表'))+' · '+f.summaryRow,f.value,f.unit);
fact((has10Q ? tr('10-Q income statement','10-Qの損益計算書') : tr('Consolidated income statement','連結損益計算書'))+' · '+f.row,f.detail,f.detailUnit);
reading.insertAdjacentHTML('beforeend',pill(f.status));
const rules = {
  '一致': tr('The figures agree for the same quarter and unit.','対象四半期と単位をそろえると両方の数値が一致します。'),
  '丸めの範囲で一致': tr('The more precise figure agrees when rounded to the summary table’s reporting precision.','詳細値を概要表の表示桁に丸めると一致します。'),
  '不一致': tr('The reported figures differ for this quarter and unit.','同じ四半期・単位の数値が異なります。'),
  '要確認': tr('One or more source values could not be verified.','原表から値を特定できないため、確認が必要です。')
};
line('p',rules[f.status],'rule');
if(f.reason) line('p',f.reason,'reference');
line('p',f.column,'reference');
const links = line('div','','links');
function source(url, title){
  const a = line('a',title,'',links);
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
}
source(d.url,tr('Exhibit 99.1 ↗','決算添付 99.1 ↗'));
if(has10Q) source(d.quarterly,tr('Form 10-Q ↗','10-Q原文 ↗'));
source(d.filing,tr('Form 8-K ↗','8-K本文 ↗'));
line('p',tr('Human review: pending','担当者確認：未確認'),'review');
}
function ledger(){
$('rows').innerHTML=records.map((d,i)=>({d,i})).reverse().map(({d,i})=>'<tr class="'+(i===selected?'active':'')+'"><td><button class="pick" aria-pressed="'+(i===selected)+'" data-i="'+i+'">'+periodText(d.period)+'</button></td><td>'+(rev(d) ?? '—')+'</td><td>'+numbers(d.facts[1].value,2)+'</td><td>'+pill(d.facts[0].status)+'</td></tr>').join('');
}
function plot(){
  const isRevenue = metric === 0;
  const names = [tr('Revenue','売上高'),tr('Diluted EPS','希薄化後EPS')];
  const values = records.map(d=>isRevenue ? rev(d) : (d.facts[1].value == null ? null : Number(d.facts[1].value)));
  const suffix = isRevenue ? tr('USD billions','十億ドル') : tr('USD/share','ドル／株');
  // Three equal intervals above a zero baseline; keep the two units independent.
  const max = Math.max(1, ...values.filter(v=>v !== null));
  const magnitude = 10 ** Math.floor(Math.log10(max / 3));
  const step = Math.ceil(max / (3 * magnitude)) * magnitude;
  for(const id of ['bars','periods']) $(id).style.gridTemplateColumns = 'repeat('+records.length+', minmax(0,1fr))';
  const ceiling = 3 * step;
  const format = v=>v == null ? '—' : isRevenue ? v.toLocaleString('en-US',{maximumFractionDigits:3}) : v.toFixed(2);
  $('chartTitle').textContent=records.length === 1 ? tr('Reported quarter','対象四半期の値') : tr('Quarterly performance','四半期推移');
  $('axisUnit').textContent=suffix;
  $('plotTools').setAttribute('aria-label',tr('Chart metric','グラフの指標'));
  $('plotTools').innerHTML=names.map((n,i)=>'<button type="button" data-m="'+i+'" aria-pressed="'+(metric===i)+'">'+n+'</button>').join('');
  $('scale').innerHTML=[0,1,2,3].map(n=>'<span style="bottom:'+(100*n/3)+'%">'+Number((n*step).toPrecision(6))+'</span>').join('');
  $('bars').setAttribute('aria-label',names[metric]+' · '+suffix);
  $('bars').innerHTML=records.map((d,i)=>{
    const label=periodText(d.period)+' · '+names[metric]+' · '+format(values[i])+' '+suffix;
    return '<button type="button" class="plot-col" data-i="'+i+'" aria-pressed="'+(i===selected)+'" aria-label="'+label+'" title="'+label+'"><i aria-hidden="true" style="height:'+(100*(values[i] ?? 0)/ceiling)+'%"></i></button>';
  }).join('');
  $('periods').innerHTML=records.map(d=>'<span>'+d.period.slice(-2)+'<small>FY'+d.period.slice(4,6)+'</small></span>').join('');
  $('plotValue').textContent=periodText(records[selected].period)+' · '+format(values[selected])+' '+suffix;
  $('plotLink').textContent=tr('Inspect source tables ↓','原表と照合結果を見る ↓');
}
function selectChart(action,container){
  action();
  plot();
  ledger();
  evidence();
  $(container).querySelector('[aria-pressed=true]').focus({preventScroll:true});
}
function draw(){
document.documentElement.lang=ja?'ja':'en';
$('lang').textContent=ja?'English':'日本語';$('lang').lang=ja?'en':'ja';
const lang = ja ? 'ja' : 'en';
for(const symbol of Object.keys(companies)){
  const link = $('link'+symbol);
  link.href = appPage ? '/company/'+symbol+'?lang='+lang : '?company='+symbol+'&lang='+lang;
  if(symbol === ticker) link.setAttribute('aria-current','page');
}
if(appPage){
  $('back').hidden = false;
  $('back').href='/companies';
  $('back').textContent=tr('All seven companies','7社の開示一覧');
}
$('issuerNav').setAttribute('aria-label',tr('Companies','企業を選ぶ'));
$('eyebrow').textContent='NASDAQ · '+ticker+'  /  '+(has10Q ? 'SEC FORM 8-K + 10-Q' : 'SEC FORM 8-K');
$('title').textContent=companyName+tr(' filing coverage',' 決算開示台帳');
document.title=$('title').textContent+' | Company Disclosure Monitor';
$('summary').textContent=has10Q
  ? tr('Compare quarterly GAAP revenue and diluted EPS in the earnings release and Form 10-Q.','決算発表資料と10-Qの原表で、四半期の売上高・希薄化後EPSを照合します。')
  : tr('Trace eight quarters of revenue and diluted EPS to the GAAP summary and income statement.','8四半期の売上高・希薄化後EPSを、決算発表のGAAP概要表と損益計算書で照合します。');
$('period').textContent=records.length === 1 ? periodText(records[0].period) : periodText(records[0].period)+' — '+periodText(records.at(-1).period);
plot();
const facts=records.flatMap(d=>d.facts);
const matches=facts.filter(f=>f.status==='一致').length;
const rounded=facts.filter(f=>f.status==='丸めの範囲で一致').length;
const needs=facts.length-matches-rounded;
const stats=[
  [records.length,tr('Fiscal quarters','対象四半期')],
  [facts.filter(f=>f.value != null && f.detail != null).length+' / '+facts.length,tr('Value pairs retrieved','両資料の値を取得')],
  [matches,tr('Exact matches','完全一致')],
  needs || has10Q ? [needs,tr('Exceptions','要確認・不一致')] : [rounded,tr('Match after rounding','丸めの範囲で一致')]
];
$('stats').innerHTML=stats.map(([n,t])=>'<div class="stat"><strong>'+n+'</strong><span>'+t+'</span></div>').join('');
$('ledgerTitle').textContent=tr('Quarterly register','四半期台帳');$('ledgerSub').textContent=tr('Select a quarter to inspect its source figures.','四半期を選ぶと、原表の値と判定理由を確認できます。');
$('download').textContent=tr('↓  Download CSV','↓  CSVを取得');$('head').innerHTML='<tr>'+[tr('Fiscal quarter','会計四半期'),tr('Revenue ($B)','売上高 ($B)'),tr('EPS ($)','EPS ($)'),tr('Revenue check','売上照合')].map(t=>'<th scope="col">'+t+'</th>').join('')+'</tr>';
$('evidence').textContent=tr('Source comparison','原表との照合');$('skip').textContent=tr('Skip to register','台帳へ移動');
$('methodTitle').textContent=tr('Scope and verification method','対象範囲と検査方法');
$('method').textContent=has10Q
  ? tr('Python compares the three-month column in the income statement of Exhibit 99.1 with the same period in the 10-Q. EPS comes from the diluted earnings-per-share row. Human review is pending.','Pythonが決算添付99.1と10-Qの損益計算書から、当四半期3か月の列を選んで照合します。EPSには希薄化後1株当たり利益の行を使用します。担当者確認は未確認です。')
  : tr('This independent demo covers NVIDIA GAAP revenue and diluted EPS for the eight fiscal quarters shown. Python compares the current-quarter GAAP summary with the three-month column of the consolidated income statement in the same SEC exhibit. The register shows revenue in billions of US dollars. The evidence panel and CSV retain the source units. All 16 human reviews are pending.','NVIDIAの8四半期を対象とした独立デモです。Pythonが同じ提出書類内のGAAP概要表と連結損益計算書の当四半期（3か月）列を照合しています。台帳は売上高を十億ドルで表示し、原表比較とCSVは開示時の単位を保持します。16項目すべて担当者確認は未確認です。');
ledger();evidence();
}
for(const id of ['bars','rows']){
  $(id).onclick=e=>{
    const button=e.target.closest('button[data-i]');
    if(!button)return;
    selectChart(()=>{selected=Number(button.dataset.i)},id);
    if(id==='rows') focusPanel();
  };
}
for(const id of ['plotTools','tabs']){
  $(id).onclick=e=>{
    const button=e.target.closest('button[data-m]');
    if(button) selectChart(()=>{metric=Number(button.dataset.m)},id);
  };
}
$('lang').onclick=()=>{ja=!ja;draw()};
$('download').onclick=()=>{
const fields=['Fiscal quarter','Metric','Reported value','Unit','Comparison value','Comparison unit','Comparison row','Comparison column','Check','Human review','Accession','Form 8-K','Exhibit 99.1','SHA-256'];
if(has10Q) fields.push('Form 10-Q','10-Q accession','10-Q SHA-256','Exception');
const rows=records.flatMap(d=>d.facts.map(f=>[d.period,f.metric,f.value,f.unit,f.detail,f.detailUnit,f.row,f.column,labels[f.status][0],'Pending',d.accession,d.filing,d.url,d.sha,...(has10Q ? [d.quarterly,d.quarterlyAccession,d.quarterlySha,f.reason] : [])]));
const csv=[fields,...rows].map(r=>r.map(x=>'"'+String(x ?? '').replaceAll('"','""')+'"').join(',')).join('\r\n')+'\r\n';
const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=has10Q ? companyName.toLowerCase()+'-'+records[0].period+'-reconciliation.csv' : 'nvidia-filing-coverage-FY2025Q4-FY2027Q3.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
draw();
</script></body></html>
